<!DOCTYPE html>
<!--
  WEDDING RSVP — single file, no build step.

  SETUP
  1. FORMSPREE: in the form tag near the bottom, the action URL ends with a placeholder.
     Replace that placeholder (the part after /f/) with your Formspree form ID.
  2. PHOTOS (optional): put images in an "images" folder next to this file.
       images/hero.jpg          -> the photo inside the arch at the top
       images/photo-1.jpg ...   -> the gallery (photo-1.jpg, photo-2.jpg, and so on)
     Missing photos are skipped automatically. See PHOTO_COUNT / PHOTO_EXT in the script.
  3. Names and date are in the header below, marked EDIT.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07060A">
  <title>Clover &amp; Oakley · November 13, 2026</title>
  <meta name="description" content="Clover and Oakley are getting married on November 13, 2026. Let us know if you can join us.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #07060A;
      --purple: #2A1237;        /* dark purple */
      --purple-band: #170B1E;
      --purple-line: #8E6FB5;
      --green: #0E241C;         /* dark green */
      --green-line: #6F8F7F;
      --ink: #ECE7F1;
      --muted: #A9A1B3;
      --lilac: #C9B3E3;
      --serif: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
      --sans: "Jost", "Futura", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

    body {
      margin: 0;
      background: var(--black);
      color: var(--ink);
      font: 300 1.0625rem/1.7 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; }
    p { margin: 0; }
    :focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }

    .wrap { width: min(1120px, 100% - 2.5rem); margin-inline: auto; }

    /* ---------- Hero ---------- */
    .hero { background: var(--black); padding-block: clamp(3rem, 8vw, 6.5rem); overflow: hidden; }
    .hero-grid { display: grid; gap: 3.5rem; align-items: center; }
    @media (min-width: 860px) { .hero-grid { grid-template-columns: 1.5fr 1fr; gap: 4rem; } }

    .names {
      font-size: clamp(3.4rem, 10vw, 7.5rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }
    .names span { display: block; }
    .names .second { padding-left: 0.8em; font-style: italic; }

    .date {
      display: inline-block;
      margin-top: clamp(1.5rem, 3vw, 2.25rem);
      padding-top: 1rem;
      border-top: 1px solid var(--purple-line);
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.5rem, 3vw, 2rem);
      color: var(--lilac);
    }
    .welcome { margin-top: 1.25rem; max-width: 30rem; color: var(--muted); }

    .btn {
      font: 500 1rem/1 var(--sans);
      display: inline-block;
      padding: 1em 2em;
      border: 1px solid transparent;
      border-radius: 2px;
      background: var(--ink);
      color: #0A0710;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover { background: #fff; }
    .btn:disabled { background: #6B6573; cursor: not-allowed; }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--green-line); }
    .btn.ghost:hover { background: rgba(255,255,255,0.07); }
    .hero .btn { margin-top: 2rem; }

    /* Pointed-arch frame: photo is clipped to the arch, outline floats just outside it. */
    .arch-wrap {
      position: relative;
      width: min(100% - 28px, 340px);
      aspect-ratio: 3 / 4;
      margin: 14px;
      justify-self: center;
    }
    .arch {
      position: absolute; inset: 0;
      clip-path: url(#ogive);
      background: linear-gradient(to top, #12301F 0%, var(--purple) 70%);
    }
    .arch img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .arch-line {
      position: absolute;
      inset: -14px;
      width: calc(100% + 28px);
      height: calc(100% + 28px);
      fill: none;
      stroke: var(--purple-line);
      stroke-width: 1;
    }

    /* One page-load moment: the names rise in, the arch follows. */
    @media (prefers-reduced-motion: no-preference) {
      .names span, .arch-wrap { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
      .names .second { animation-delay: 0.15s; }
      .arch-wrap { animation-delay: 0.4s; }
      @keyframes rise { from { opacity: 0; transform: translateY(0.15em); } }
    }

    /* ---------- Gallery ---------- */
    .gallery { background: var(--purple-band); padding-block: clamp(3rem, 7vw, 5rem); }
    .gallery-grid { columns: 3 260px; column-gap: clamp(0.75rem, 1.6vw, 1.25rem); }
    .gallery-grid img {
      display: block; width: 100%; height: auto;
      margin: 0 0 clamp(0.75rem, 1.6vw, 1.25rem);
      border-radius: 2px;
      break-inside: avoid;
      filter: grayscale(0.2) contrast(1.05);
    }

    /* ---------- RSVP ---------- */
    .rsvp { background: var(--green); padding-block: clamp(3.5rem, 8vw, 6rem); }
    .rsvp-grid { display: grid; gap: 2.5rem; align-items: start; }
    @media (min-width: 860px) { .rsvp-grid { grid-template-columns: 1fr 1.1fr; gap: 5rem; } }

    .rsvp h2 { font-size: clamp(2.4rem, 5.5vw, 3.8rem); line-height: 1.05; }
    .rsvp .intro { margin-top: 1rem; max-width: 24rem; color: var(--muted); }

    .field { margin-bottom: 1.5rem; }
    label, legend { display: block; font-weight: 400; font-size: 0.95rem; margin-bottom: 0.5rem; padding: 0; }
    input[type="text"] {
      width: 100%;
      padding: 0.9rem 1rem;
      font: inherit;
      color: var(--ink);
      background: #07110D;
      border: 1px solid var(--green-line);
      border-radius: 2px;
    }
    input[type="text"]:focus { outline: 2px solid var(--lilac); outline-offset: 0; border-color: var(--lilac); }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

    fieldset { border: 0; padding: 0; margin: 0 0 1.75rem; min-width: 0; }
    .choices { display: grid; gap: 0.75rem; }
    @media (min-width: 480px) { .choices { grid-template-columns: 1fr 1fr; } }
    .choice { position: relative; display: block; margin: 0; }
    .choice input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .choice span {
      display: block;
      padding: 1rem 1.1rem;
      border: 1px solid var(--green-line);
      border-radius: 2px;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .choice input:focus-visible + span { outline: 3px solid var(--lilac); outline-offset: 3px; }
    .choice.yes input:checked + span { background: #1F5A43; border-color: #8FD1B0; }
    .choice.no  input:checked + span { background: #4B2670; border-color: #B99BE0; }

    .error {
      margin: 0 0 1.25rem;
      padding: 0.8rem 1rem;
      border-left: 3px solid #E08A7B;
      background: #2A1412;
      font-size: 0.95rem;
    }
    form .btn { width: 100%; }

    .thanks h3 { font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.15; outline: none; }
    .thanks p { margin: 0.75rem 0 1.75rem; color: var(--muted); }
    .thanks .btn { width: auto; padding: 0.85em 1.6em; }
    @media (prefers-reduced-motion: no-preference) {
      .thanks { animation: rise 0.6s cubic-bezier(.2,.7,.2,1) both; }
    }

    footer { padding-block: 2rem 2.5rem; text-align: center; color: var(--muted); font-size: 0.95rem; background: var(--black); }
  </style>
</head>
<body>

  <!-- Shape used to clip the hero photo into a pointed arch -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <clipPath id="ogive" clipPathUnits="objectBoundingBox">
        <path d="M0,1 V0.45 C0,0.22 0.3,0.1 0.5,0 C0.7,0.1 1,0.22 1,0.45 V1 Z"/>
      </clipPath>
    </defs>
  </svg>

  <header class="hero">
    <div class="wrap hero-grid">
      <div>
        <!-- EDIT: your names -->
        <h1 class="names"><span>Clover</span><span class="second">&amp; Oakley</span></h1>
        <!-- EDIT: wedding date (update both the datetime value and the visible text) -->
        <p class="date"><time datetime="2026-11-13">November 13, 2026</time></p>
        <!-- EDIT: welcome message -->
        <p class="welcome">We’re getting married, and we’d love to have you there. Let us know if you can make it so we can plan for you.</p>
        <a class="btn" href="#rsvp">RSVP</a>
      </div>

      <div class="arch-wrap">
        <div class="arch"><img id="heroImg" alt=""></div>
        <svg class="arch-line" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <path d="M0,1 V0.45 C0,0.22 0.3,0.1 0.5,0 C0.7,0.1 1,0.22 1,0.45 V1" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>
    </div>
  </header>

  <main>
    <section class="gallery" id="gallery" aria-label="Photos of Clover and Oakley" hidden>
      <div class="wrap"><div class="gallery-grid" id="galleryGrid"></div></div>
    </section>

    <section class="rsvp" id="rsvp" aria-labelledby="rsvpTitle">
      <div class="wrap rsvp-grid">
        <div>
          <h2 id="rsvpTitle">Will you be there?</h2>
          <p class="intro">Tell us who you are and whether you can come. It takes a few seconds.</p>
        </div>

        <div>
          <!-- PASTE YOUR FORMSPREE ID: replace the placeholder at the end of the action URL below -->
          <form id="rsvpForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <div class="field">
              <label for="guestName">Your name(s)</label>
              <input type="text" id="guestName" name="name" autocomplete="name" required>
            </div>

            <fieldset>
              <legend>Can you make it?</legend>
              <div class="choices">
                <label class="choice yes"><input type="radio" name="attending" value="Yes" required><span>Yes, I’ll be there</span></label>
                <label class="choice no"><input type="radio" name="attending" value="No"><span>No, I can’t make it</span></label>
              </div>
            </fieldset>

            <!-- Spam trap (leave as is) and email subject line -->
            <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
            <input type="hidden" name="_subject" id="subjectField" value="New RSVP">

            <p class="error" id="formError" role="alert" hidden></p>
            <button class="btn" type="submit" id="submitBtn">Send RSVP</button>
          </form>

          <div class="thanks" id="thanks" hidden>
            <h3 id="thanksTitle" tabindex="-1"></h3>
            <p id="thanksBody"></p>
            <button class="btn ghost" type="button" id="changeBtn">Change my answer</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>Clover &amp; Oakley, November 13, 2026</footer>

  <script>
    (() => {
      /* ---------- Photos ---------- */
      const PHOTO_COUNT = 12;   // tries images/photo-1.jpg ... images/photo-12.jpg
      const PHOTO_EXT = "jpg";  // change to "jpeg", "png", or "webp" to match your files
      const HERO_PHOTO = "images/hero.jpg";

      const $ = id => document.getElementById(id);

      const heroImg = $("heroImg");
      heroImg.addEventListener("error", () => heroImg.remove()); // no photo: keep the plain arch
      heroImg.src = HERO_PHOTO;

      const loadImage = src => new Promise(resolve => {
        const img = new Image();
        img.alt = "";
        img.decoding = "async";
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });

      Promise.all(
        Array.from({ length: PHOTO_COUNT }, (_, i) => loadImage(`images/photo-${i + 1}.${PHOTO_EXT}`))
      ).then(results => {
        const found = results.filter(Boolean);
        if (!found.length) return;                       // no photos uploaded: gallery stays hidden
        $("galleryGrid").append(...found);
        $("gallery").hidden = false;
      });

      /* ---------- RSVP form (Formspree, no page reload) ---------- */
      const form = $("rsvpForm"), thanks = $("thanks");
      const nameField = $("guestName"), errorBox = $("formError"), submitBtn = $("submitBtn");

      const showError = msg => { errorBox.textContent = msg; errorBox.hidden = false; };

      form.addEventListener("submit", async e => {
        e.preventDefault();
        errorBox.hidden = true;

        if (form.action.includes("YOUR_" + "FORM_ID")) {
          showError("This form isn’t connected yet. Add your Formspree form ID to the form’s action URL in index.html.");
          return;
        }

        const name = nameField.value.trim();
        const attending = form.elements["attending"].value;      // "Yes" or "No"
        $("subjectField").value = `RSVP: ${name} (${attending})`; // shows who and yes/no in your inbox

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending…";

        try {
          const res = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: { Accept: "application/json" }
          });

          if (res.ok) {
            const coming = attending === "Yes";
            $("thanksTitle").textContent = coming ? `We can’t wait to see you, ${name}.` : `We’ll miss you, ${name}.`;
            $("thanksBody").textContent = coming ? "You’re on the list for November 13." : "Thank you for letting us know.";
            form.hidden = true;
            thanks.hidden = false;
            $("thanksTitle").focus();
          } else {
            const data = await res.json().catch(() => ({}));
            const msg = data.errors && data.errors.map(x => x.message).join(", ");
            showError(msg || "Something went wrong, and your RSVP wasn’t sent. Please try again.");
          }
        } catch (err) {
          showError("We couldn’t reach the server. Check your connection and try again.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Send RSVP";
        }
      });

      // Plans change: let a guest send a new answer.
      $("changeBtn").addEventListener("click", () => {
        thanks.hidden = true;
        form.hidden = false;
        nameField.focus();
      });
    })();
  </script>
</body>
</html>
